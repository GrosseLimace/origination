    app_insights: appi-origination-qa-eus
    log_roots:
      - /home/LogFiles
  prod:
    subscription: scoular-apps-prod
    resource_group: rg-origination-eus          # by naming convention — UNVERIFIED (prod resources not readable by current account)
    web_app: app-origination-eus                # by naming convention — UNVERIFIED
    app_insights: appi-origination-eus          # by naming convention — UNVERIFIED; run with --refresh-config once prod Reader access is granted
