openapi: 3.0.3
info:
  title: Origination External API
  version: '1.0'
  description: |
    External-facing (mobile) endpoints for the Origination Workbench.
    Skeleton per developer-docs/EXTERNAL-SPA-GUIDE.md. Paths are relative to the APIM
    path prefix; the backend serves them under /api/mobile/v1. Only endpoints listed here
    are reachable from the mobile client.

    STATUS: paths are intentionally empty until the v1 operation list is decided
    (docs/mobile/MEETING-QUESTIONS.md, question 4). Fill in, then follow the change
    process in openapi/README.md.

    Conventions for added operations:
      - operationId in camelCase, unique; it becomes the generated TypeScript method name.
      - Every operation declares security with the environment's mobile scope.
      - Every response schema is a component; no producer contact PII unless meeting Q9 says yes.
      - Mutations accept a clientRequestId (uuid) for idempotent offline replay.
      - Error responses reference components/responses below.
  contact:
    name: Origination app team
servers:
  - url: http://localhost:5000/api/mobile/v1
    description: Local development (direct to the .NET API)
  - url: https://origination-dev.scoular.com/api/mobile/v1
    description: Dev (direct to App Service; no APIM in dev)
  - url: https://apiqa.scoular.com/{apimPathPrefix}
    description: QA (through APIM)
    variables:
      apimPathPrefix:
        default: external/origination/v1
        description: Assigned by Data Integrations
  - url: https://api.scoular.com/{apimPathPrefix}
    description: Prod (through APIM)
    variables:
      apimPathPrefix:
        default: external/origination/v1
        description: Assigned by Data Integrations
security:
  - entraId: []
tags:
  - name: customers
    description: Producers in the caller's entitled trade units
  - name: notes
    description: Producer notes (read, and offline-queued create)
  - name: reminders
    description: The caller's own follow-up reminders
  - name: bids
    description: Read-only bid view for entitled locations
  - name: reference
    description: Commodities and trade units
paths: {}
components:
  securitySchemes:
    entraId:
      type: oauth2
      description: >
        Entra ID (tenant 1521f999-f722-4a4f-9747-166f93e9b0d1). Audience is the Origination API
        app registration; the mobile client requests the environment-specific scope below.
        APIM validates the token and passes it through unchanged.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/1521f999-f722-4a4f-9747-166f93e9b0d1/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/1521f999-f722-4a4f-9747-166f93e9b0d1/oauth2/v2.0/token
          scopes:
            api://00078a10-3f3f-4d17-9350-fe90401125ae/Origination.Mobile.Dev: Mobile access (Dev)
            api://f3fcab2b-98c8-4622-86bd-c874d281b22a/Origination.Mobile.QA: Mobile access (QA)
            api://e1458bcd-7212-4ea0-a836-7e08d03b5bbf/Origination.Mobile.Prod: Mobile access (Prod)
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Client-supplied correlation id; echoed on the response and propagated by APIM.
      schema:
        type: string
        maxLength: 64
  schemas:
    ApiError:
      type: object
      description: Matches the backend ApiErrorResponse produced by GlobalExceptionHandler.
      required: [code, message, traceId, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid token
    Forbidden:
      description: Token lacks the mobile scope, wrong client, or trade unit not entitled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found, or outside the caller's entitlement
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Rate limit exceeded (APIM or backend)
