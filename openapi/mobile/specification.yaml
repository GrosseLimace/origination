openapi: 3.0.3
info:
  title: Origination External API
  version: '1.0'
  description: |
    External-facing (mobile) endpoints for the Origination Workbench.
    Produced per developer-docs/EXTERNAL-SPA-GUIDE.md. Paths are relative to the APIM
    path prefix; the backend serves them under /api/mobile/v1. Only endpoints listed here
    are reachable from the mobile client.

    Scope source: GitHub cards #641-#648 (Phase 1), created 2026-09-23. Phase 2 cards
    (#649 prospects, #650 directions, #651 dictated notes) add no endpoints except
    prospects, which will be a later revision of this file.

    Conventions:
      - operationId in camelCase, unique; it becomes the generated TypeScript method name.
      - Every operation requires the environment's mobile scope (see securitySchemes).
      - Mutations carry a clientRequestId (uuid). Replaying the same id returns the
        original result (200/201 with the existing row) so offline queues can retry safely.
      - Producer contact phone/email ARE returned (card #642, meeting Q9 = yes). The client
        must never persist them to cache.
      - Every customer-scoped path is checked against the caller's trade-unit entitlement;
        a customer outside it returns 404, never 403, to prevent enumeration.
  contact:
    name: Origination app team
servers:
  - url: http://localhost:5000/api/mobile/v1
    description: Local development (direct to the .NET API)
  - url: https://origination-dev.scoular.com/api/mobile/v1
    description: Dev (company network only)
  - url: https://origination-qa.scoular.com/api/mobile/v1
    description: QA (internet access through the App Gateway WAF, mobile paths only)
  - url: https://origination.scoular.com/api/mobile/v1
    description: Production (internet access through the App Gateway WAF, mobile paths only)
security:
  - entraId: []
tags:
  - name: session
    description: Caller identity and entitled trade units
  - name: customers
    description: Producer search and detail (cards #641, #642)
  - name: producer-details
    description: On-farm details (card #643)
  - name: notes
    description: Producer notes (card #644)
  - name: contracts
    description: Contract cards (card #645)
  - name: tickets
    description: Rolled-up ticket summary (card #646)
  - name: planting-intentions
    description: Planting intentions (card #647)
  - name: storage
    description: Storage and DP contract cards (card #648)
  - name: reference
    description: Commodity reference data

paths:
  /me:
    get:
      tags: [session]
      operationId: getSession
      summary: Current user and entitled trade units
      description: >
        Returns the caller's display name, the trade units they are entitled to, and their Trade
        Unit Preferences groups. Whether a trade unit offers storage is asked separately
        (getTradeUnitStorage).
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /trade-units/storage:
    get:
      tags: [session]
      operationId: getTradeUnitStorage
      summary: Whether each selected trade unit offers storage
      description: >
        Card #648. The Storage & DP tab exists only for producers at a trade unit that offers storage.
        Derived from the data: a trade unit offers storage when any of its producers has a DP contract
        or a storage receipt (an optional per-environment list can force it on). Asked separately from
        the producer read because the first answer per trade unit can take a few seconds; answers are
        then cached server-side (yes for 12 hours, no for 1 hour).
      parameters:
        - name: tradeUnits
          in: query
          required: true
          schema:
            type: array
            items: { type: string, maxLength: 10 }
            minItems: 1
            maxItems: 20
          style: form
          explode: true
      responses:
        '200':
          description: One entry per requested trade unit
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TradeUnitStorage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /customers:
    get:
      tags: [customers]
      operationId: searchCustomers
      summary: Search producers by name within the caller's trade units
      description: >
        Card #641. With q, a name search. Without q, the producers in the selected (or all entitled)
        trade units ordered by name, so the first screen is never empty. Capped by limit either way;
        this is a browse list, not the desktop's list-building surface.
      parameters:
        - name: q
          in: query
          required: false
          description: Name fragment, minimum 2 characters when present
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: tradeUnits
          in: query
          required: false
          description: Restrict to these trade-unit codes (must all be entitled, else 403)
          schema:
            type: array
            items: { type: string, maxLength: 10 }
            maxItems: 20
          style: form
          explode: true
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Matching producers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomerSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Producer header with contacts
      description: >
        Cards #641 and #642. Includes contact phone/email for tap-to-call and tap-to-email
        via the device's native dialer and mail app. The client must not cache this response.
      responses:
        '200':
          description: Producer detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /customers/{customerId}/details:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [producer-details]
      operationId: getProducerDetails
      summary: On-farm details (acres, bin capacity, grain on farm)
      description: Card #643.
      responses:
        '200':
          description: On-farm details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProducerDetails' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      tags: [producer-details]
      operationId: updateProducerDetails
      summary: Update on-farm details
      description: >
        Card #643. Updates total acres and, when sent, the bin sites and grain on farm. A list that is
        present replaces the stored set (array order is the display order); a list that is absent is
        preserved. Contacts and linked producers are never edited from mobile. Send expectedModifiedAt
        so a desktop edit made in between returns 409 instead of being overwritten. Audited with
        before/after values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProducerDetailsUpdate' }
      responses:
        '200':
          description: Updated details (also returned on idempotent replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProducerDetails' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /customers/{customerId}/notes:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [notes]
      operationId: getRecentNotes
      summary: Pinned note plus the most recent notes
      description: >
        Card #644. Returns the pinned note (if any) first, then the newest notes up to the
        limit. Deleted notes are excluded. No full-history paging on mobile.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10, default: 10 }
      responses:
        '200':
          description: Notes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecentNotes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [notes]
      operationId: createNote
      summary: Add a note
      description: >
        Card #644 (and #651 in Phase 2: dictated text arrives as a normal note). Offline-queued
        on the client; the clientRequestId makes replay safe. No @mentions on mobile in v1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '200':
          description: Idempotent replay; the previously created note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /customers/{customerId}/contracts:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [contracts]
      operationId: getContractCards
      summary: Contract cards (collapsed view)
      description: >
        Card #645. Only the at-a-glance fields. Contract value is deliberately omitted.
        Read from the ODS view; may be slow on a cold serverless database.
      parameters:
        - name: includeClosed
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Contract cards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContractCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /customers/{customerId}/contracts/{contractId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - name: contractId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [contracts]
      operationId: getContractDetail
      summary: Expanded contract detail
      description: Card #645, the expanded card. Pricing lines included; still no dollar value.
      responses:
        '200':
          description: Contract detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /customers/{customerId}/tickets/summary:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [tickets]
      operationId: getTicketSummary
      summary: Tickets rolled up to count and bushels
      description: >
        Card #646. One group per contract the tickets applied to, plus one "unapplied" group.
        No line items, no weights, no crop/location columns.
      parameters:
        - name: cropYear
          in: query
          required: false
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        '200':
          description: Ticket summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /customers/{customerId}/planting-intentions:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [planting-intentions]
      operationId: getPlantingIntentions
      summary: Planting intentions as cards
      description: Card #647. Crop, acres and year only.
      responses:
        '200':
          description: Planting intentions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlantingIntention' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [planting-intentions]
      operationId: createPlantingIntention
      summary: Add a planting intention
      description: Card #647. Year-level granularity only; no calendar date.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlantingIntentionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlantingIntention' }
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlantingIntention' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /customers/{customerId}/planting-intentions/{intentionId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - name: intentionId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [planting-intentions]
      operationId: updatePlantingIntention
      summary: Update acres or crop on an existing planting intention
      description: Card #647 ("view, add, and update"). Audited with before/after values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlantingIntentionUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlantingIntention' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /customers/{customerId}/storage:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [storage]
      operationId: getStorageCards
      summary: Storage (warehouse receipt) positions as cards
      description: >
        Card #648. Hidden by the client when the producer's trade unit does not offer storage
        (getTradeUnitStorage). Read from the ODS view.
      responses:
        '200':
          description: Storage cards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StorageCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /customers/{customerId}/dp-contracts:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [storage]
      operationId: getDpContractCards
      summary: Deferred-payment contract balances as cards
      description: >
        Card #648. Total count and bushels are sufficient; ticket-level detail is not required.
        DP data exists only in production ODS; Dev and QA return an empty array by design.
      responses:
        '200':
          description: DP contract cards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DpContractCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /reference/commodities:
    get:
      tags: [reference]
      operationId: getPlantingCommodities
      summary: Crops selectable when adding a planting intention
      description: Card #647. Scoped to the caller's trade units (trade-unit and trade-group scoped commodities apply).
      responses:
        '200':
          description: Commodities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Commodity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    entraId:
      type: oauth2
      description: >
        Entra ID (tenant 1521f999-f722-4a4f-9747-166f93e9b0d1). Audience is the Origination API
        app registration. Sign-in is shared with the desktop, as Burdi's driver app shares Burdi's
        (decided 2026-10-15): the phone uses the desktop SPA registration and the environment's
        desktop scope below; the backend accepts only tokens issued to that registration.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/1521f999-f722-4a4f-9747-166f93e9b0d1/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/1521f999-f722-4a4f-9747-166f93e9b0d1/oauth2/v2.0/token
          scopes:
            api://00078a10-3f3f-4d17-9350-fe90401125ae/Origination.Application.Dev: Origination access (Dev)
            api://f3fcab2b-98c8-4622-86bd-c874d281b22a/Origination.Application.QA: Origination access (QA)
            api://e1458bcd-7212-4ea0-a836-7e08d03b5bbf/Origination.Application.Prod: Origination access (Prod)

  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      description: Origination customer id (dbo.Customer.Id)
      schema: { type: integer, format: int64 }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Client-supplied correlation id; echoed on the response and propagated by APIM.
      schema: { type: string, maxLength: 64 }

  schemas:
    Session:
      type: object
      required: [displayName, tradeUnits, groups]
      properties:
        displayName: { type: string }
        tradeUnits:
          type: array
          items: { $ref: '#/components/schemas/TradeUnit' }
        groups:
          type: array
          description: The caller's Trade Unit Preferences groups; the first screen of the producer flow.
          items: { $ref: '#/components/schemas/TradeUnitGroup' }

    TradeUnitGroup:
      type: object
      required: [name, tradeUnitCodes]
      properties:
        name: { type: string }
        tradeUnitCodes:
          type: array
          items: { type: string }

    TradeUnit:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }

    TradeUnitStorage:
      type: object
      required: [code, offersStorage]
      properties:
        code: { type: string }
        offersStorage: { type: boolean, description: "Drives whether the Storage & DP tab exists (card #648)." }

    CustomerSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        scoularId: { type: string, nullable: true }
        name: { type: string }
        location: { type: string, nullable: true, description: City/state line for disambiguation }
        tradeUnit: { type: string, nullable: true }

    CustomerDetail:
      type: object
      required: [id, name, contacts]
      properties:
        id: { type: integer, format: int64 }
        scoularId: { type: string, nullable: true }
        name: { type: string }
        farm: { type: string, nullable: true }
        addressLine1: { type: string, nullable: true }
        city: { type: string, nullable: true }
        stateProvince: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        tradeUnit: { type: string, nullable: true }
        eSignEnabled: { type: boolean }
        contacts:
          type: array
          description: Primary first. Phone/email are PII; never cache.
          items: { $ref: '#/components/schemas/Contact' }

    Contact:
      type: object
      required: [name, isPrimary]
      properties:
        name: { type: string }
        phone: { type: string, nullable: true, description: "As stored (national or E.164); the client normalises it for tel: links" }
        email: { type: string, nullable: true, format: email }
        isPrimary: { type: boolean }

    ProducerDetails:
      type: object
      description: >
        Storage capacity is recorded per bin site and grain on farm is tied to a site. Every site and
        grain field is returned, including ones the phone may not display (site key, coordinates, last
        bid), so an update can send the lists back whole without losing anything.
      required: [customerId, binSites, grainOnFarm]
      properties:
        customerId: { type: integer, format: int64 }
        totalAcres: { type: number, nullable: true }
        totalBinCapacity: { type: number, nullable: true, description: "Bushels; sum of the sites' capacities" }
        binSites:
          type: array
          items: { $ref: '#/components/schemas/BinSite' }
        grainOnFarm:
          type: array
          items: { $ref: '#/components/schemas/GrainOnFarmItem' }
        modifiedBy: { type: string, nullable: true }
        modifiedAt: { type: string, format: date-time, nullable: true }

    BinSite:
      type: object
      description: Only the name is required. Coordinates come as a pair or not at all.
      required: [name]
      properties:
        siteKey:
          type: string
          format: uuid
          nullable: true
          description: Stable key; echo it back for an existing site, generate one for a new site. Grain rows link to it.
        name: { type: string, minLength: 1, maxLength: 100 }
        capacity: { type: number, nullable: true, minimum: 0, maximum: 100000000, description: Bushels }
        latitude: { type: number, nullable: true, minimum: 7, maximum: 84 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: -52 }

    GrainOnFarmItem:
      type: object
      required: [commodityCode]
      properties:
        binSiteKey:
          type: string
          format: uuid
          nullable: true
          description: The siteKey of the site this grain is stored at; null or unknown stores it without a site.
        binSiteName: { type: string, nullable: true, maxLength: 100, description: For display; ignored on write. }
        commodityCode: { type: string, minLength: 1, maxLength: 100 }
        bushelsOnHand: { type: number, nullable: true, minimum: 0, maximum: 1000000000 }
        bushelsSold: { type: number, nullable: true, minimum: 0, maximum: 1000000000 }
        targetBushels: { type: number, nullable: true, minimum: -1000000000, maximum: 1000000000, description: "$/bu target price; may be negative (basis)." }
        lastBid: { type: number, nullable: true, minimum: -1000000000, maximum: 1000000000, description: "May be negative (basis)." }
        grade: { type: string, nullable: true, maxLength: 100 }

    ProducerDetailsUpdate:
      type: object
      description: >
        A list that is present replaces the stored set; a list that is absent is preserved. Send the
        sites and grain rows exactly as read (keys, coordinates and last bid included) plus any edits.
      required: [clientRequestId]
      properties:
        clientRequestId: { type: string, format: uuid }
        totalAcres: { type: number, nullable: true, minimum: 0, maximum: 10000000 }
        binSites:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/BinSite' }
        grainOnFarm:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/GrainOnFarmItem' }
        expectedModifiedAt:
          type: string
          format: date-time
          nullable: true
          description: Optimistic concurrency; 409 if the record changed since the client read it.

    RecentNotes:
      type: object
      required: [notes, hasMore]
      properties:
        pinned: { $ref: '#/components/schemas/Note' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/Note' }
        hasMore: { type: boolean, description: True when older notes exist beyond the cap }

    Note:
      type: object
      required: [id, customerId, content, createdBy, createdAt, isPinned]
      properties:
        id: { type: integer }
        customerId: { type: integer, format: int64 }
        subject: { type: string, nullable: true }
        content: { type: string }
        createdBy: { type: string, description: Short user name }
        createdAt: { type: string, format: date-time }
        isPinned: { type: boolean }

    NoteCreate:
      type: object
      required: [clientRequestId, content]
      properties:
        clientRequestId: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 4000 }
        capturedAt:
          type: string
          format: date-time
          nullable: true
          description: When the note was written on the device (may predate sync)

    ContractCard:
      type: object
      required: [id, contractNumber]
      properties:
        id: { type: integer, format: int64 }
        contractNumber: { type: string }
        commodityCode: { type: string, nullable: true }
        commodityDescription: { type: string, nullable: true }
        quantity: { type: number, nullable: true }
        unit: { type: string, nullable: true }
        price: { type: number, nullable: true }
        priceTypeCode: { type: string, nullable: true, description: "P = priced, U = unpriced, D = deferred" }
        deliveryStart: { type: string, format: date-time, nullable: true }
        deliveryEnd: { type: string, format: date-time, nullable: true }
        specialType: { type: string, nullable: true }
        status: { type: string }

    ContractDetail:
      allOf:
        - $ref: '#/components/schemas/ContractCard'
        - type: object
          properties:
            cropYear: { type: integer, nullable: true }
            openBalanceQuantity: { type: number, nullable: true }
            settledQuantity: { type: number, nullable: true }
            pricedQuantity: { type: number, nullable: true }
            signed: { type: boolean }
            customerConfirmStatus: { type: string, nullable: true }
            basisLocation: { type: string, nullable: true }
            marketZone: { type: string, nullable: true }
            contractDate: { type: string, format: date-time, nullable: true }
            pricingLines:
              type: array
              items: { $ref: '#/components/schemas/PricingLine' }

    PricingLine:
      type: object
      properties:
        quantity: { type: number, nullable: true }
        price: { type: number, nullable: true }
        status: { type: string, nullable: true }
        marketMonth: { type: string, nullable: true }

    TicketSummary:
      type: object
      required: [groups, totalTickets, totalBushels]
      properties:
        totalTickets: { type: integer }
        totalBushels: { type: number }
        groups:
          type: array
          items: { $ref: '#/components/schemas/TicketGroup' }

    TicketGroup:
      type: object
      required: [key, ticketCount, bushels]
      properties:
        key: { type: string, description: "Contract number, or the literal 'unapplied'" }
        contractId: { type: integer, format: int64, nullable: true }
        commodityCode: { type: string, nullable: true }
        ticketCount: { type: integer }
        bushels: { type: number }
        lastTicketDate: { type: string, format: date-time, nullable: true }

    PlantingIntention:
      type: object
      required: [id, customerId, plantingYear, crop, acres]
      properties:
        id: { type: integer }
        customerId: { type: integer, format: int64 }
        plantingYear: { type: integer }
        crop: { type: string }
        acres: { type: integer }
        tradeUnit: { type: string }
        modifiedAt: { type: string, format: date-time, nullable: true }

    PlantingIntentionCreate:
      type: object
      required: [clientRequestId, plantingYear, crop, acres]
      properties:
        clientRequestId: { type: string, format: uuid }
        plantingYear: { type: integer, minimum: 2000, maximum: 2100 }
        crop: { type: string, maxLength: 20, description: Commodity code from /reference/commodities }
        acres: { type: integer, minimum: 0, maximum: 10000000 }

    PlantingIntentionUpdate:
      type: object
      required: [clientRequestId, acres]
      properties:
        clientRequestId: { type: string, format: uuid }
        crop: { type: string, maxLength: 20, nullable: true }
        acres: { type: integer, minimum: 0, maximum: 10000000 }
        expectedModifiedAt: { type: string, format: date-time, nullable: true }

    StorageCard:
      type: object
      required: [id, receiptNumber, crop, bushels]
      properties:
        id: { type: string }
        receiptNumber: { type: string }
        crop: { type: string }
        bushels: { type: number }
        locationCity: { type: string, nullable: true }
        locationState: { type: string, nullable: true }
        storageStartDate: { type: string, format: date-time, nullable: true }
        storageRate: { type: number, nullable: true }
        receivableAmount: { type: number, nullable: true }

    DpContractCard:
      type: object
      required: [id, contractNumber, crop]
      properties:
        id: { type: string }
        contractNumber: { type: string }
        crop: { type: string }
        bushels: { type: number, nullable: true }
        quantity: { type: number }
        quantityUom: { type: string }
        statusDescription: { type: string }
        storageStartDate: { type: string, format: date-time, nullable: true }
        paidThruDate: { type: string, format: date-time, nullable: true }
        receivableAmount: { type: number }

    Commodity:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        plantingCategory: { type: string, nullable: true }

    ApiError:
      type: object
      description: Matches the backend ApiErrorResponse produced by GlobalExceptionHandler.
      required: [code, message, traceId, timestamp]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Missing or invalid token
    Forbidden:
      description: Token lacks the mobile scope, wrong client, or trade unit not entitled
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Not found, or outside the caller's entitlement
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Record changed since the client read it (expectedModifiedAt mismatch)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    TooManyRequests:
      description: Rate limit exceeded (APIM or backend)
    UpstreamUnavailable:
      description: ODS database unavailable or waking from auto-pause; retry shortly
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
