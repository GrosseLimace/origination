<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Origination Workbench</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Origination">
  <!-- CSP is served as an HTTP header by the Static Web App configuration (public/staticwebapp.config.json). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <!-- Open Sans, the same as the desktop Workbench. display=swap: text shows at once in the system font and
       swaps when the font arrives, so poor signal never blocks the first paint; the service worker caches it. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased bg-gray-50 text-gray-900">
  <mob-root></mob-root>
</body>
</html>
