@if (isAuthenticated()) {
  <div class="h-screen flex flex-col bg-gray-50 dark:bg-gray-900 transition-colors overflow-hidden">
    <app-header />
    <!-- While the Help panel is open on desktop, the page makes room for it (400px plus the usual gutter)
         instead of being covered. -->
    <main class="max-w-[2000px] w-full mx-auto p-4 sm:p-6 lg:p-6 flex-grow overflow-y-auto"
      [style.padding-right.px]="helpPanel.pushesPage() ? 424 : null">
      <router-outlet />
    </main>
<app-toast-container />
    <!-- Deferred like the What's New dialog: most sessions never open Help, so it stays out of the initial
         bundle and loads the first time the panel opens. -->
    @defer (when helpPanel.open()) {
      <app-help-panel />
    }
    <!-- Announces the releases the user has not acknowledged yet, once per deploy that carried
         release notes. The same content stays reachable at /whats-new afterwards.
         Deferred so the dialog and its release list stay out of the initial bundle — most loads
         never open it, and the eager cost pushed the initial bundle past its budget. -->
    @defer (when showWhatsNew()) {
      <app-whats-new-dialog
        [isOpen]="showWhatsNew()"
        [releases]="whatsNew.unseenReleases()"
        (close)="onWhatsNewClose()"
      />
    }
  </div>
} @else {
  <div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900">
    <div class="text-center">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-gray-300 dark:border-gray-600 border-t-scoular-green"></div>
      <p class="mt-4 text-gray-500 dark:text-gray-400 text-sm">Signing in...</p>
    </div>
  </div>
}
