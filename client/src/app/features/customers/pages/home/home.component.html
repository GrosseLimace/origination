<div class="grid grid-cols-1 lg:grid-cols-[clamp(300px,calc(15.5vw_+_112px),430px)_minmax(0,1fr)] gap-4 lg:gap-4 h-full overflow-auto lg:overflow-hidden pr-1 lg:pr-0">
  <!-- Customer List — fr tracks (not percentages) so the gap is subtracted from
       the tracks instead of overflowing the grid; the minmax floor keeps the list
       readable on laptops. -->
  <div class="lg:max-h-full lg:pb-2 lg:flex lg:flex-col lg:min-h-0" [class.hidden]="selectedCustomer() && isMobile()" [class.lg:flex]="true">
    <app-customer-list
      class="flex flex-col min-h-0 lg:flex-1"
      [customers]="customers()"
      [selectedCustomer]="selectedCustomer()"
      [savedLists]="savedLists()"
      [noteLastContacts]="noteLastContacts()"
      [myReminders]="myReminders()"
      [loading]="loading()"
      [producerDetailsMap]="producerDetailsMap()"
      [linkedProducerCustomers]="crossTradeUnitCustomers()"
      (selectCustomer)="handleSelectCustomer($event)"
      (prefetchCustomer)="handlePrefetchCustomer($event)"
      (clearSelection)="handleClearSelection()"
    />
  </div>

  <!-- Profile and Notes Container - Optimized content display (78% on 2xl) -->
  <div [class.hidden]="!selectedCustomer() && isMobile()" [class.lg:block]="true" class="lg:overflow-auto lg:max-h-full lg:pb-2 lg:pr-1">
    <div class="space-y-6"
      [class]="contractsWide() ? '' : 'xl:grid xl:grid-cols-[minmax(0,1fr)_clamp(320px,24vw,460px)] xl:gap-3 xl:space-y-0'">
      <!-- Profile Section — declares the named container the profile subtree sizes
           against. Its children must use @*/profile: variants, not viewport
           prefixes: this column is ~600px on a laptop while the viewport is 1366. -->
      <div class="space-y-6 min-w-0 @container/profile">
        @if (selectedCustomer(); as customer) {
          <!-- Back button on mobile -->
          <button
            class="lg:hidden flex items-center text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 mb-4"
            (click)="selectedCustomer.set(null)"
          >
            <svg class="h-5 w-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to Producers
          </button>

          <!-- Profile -->
          <app-customer-profile
            [customer]="customer"
            [allCustomers]="customers()"
            [selectedTradeUnits]="selectedTradeUnits()"
            [contracts]="customerContracts()"
            [tickets]="customerTickets()"
            [pricingLines]="customerPricingLines()"
            [plantingIntentions]="customerPlantingIntentions()"
            [storedGrain]="customerStoredGrain()"
            [dpContracts]="customerDpContracts()"
            [notes]="customerNotes()"
            [yieldEstimates]="yieldEstimates()"
            [commodities]="commodities()"
            [isLoadingEstimates]="isLoadingYieldData()"
            [isLoadingPlanting]="isLoadingPlanting()"
            [isLoadingStoredGrain]="isLoadingStoredGrain()"
            [isLoadingDpContracts]="isLoadingDpContracts()"
            [allCustomerContracts]="allCustomerContracts()"
            (onAddPlanting)="addPlantingIntention($event)"
            (onEditPlanting)="editPlantingIntention($event)"
            (onDeletePlanting)="deletePlantingIntention($event)"
            [linkedCustomers]="getLinkedGroup(customer)"
            (onSaveCustomer)="handleSaveCustomer($event)"
            [isSavingTradeUnits]="isSavingTradeUnits()"
            (onSelectLinkedCustomer)="handleSelectLinkedCustomer($event)"
            [openTab]="pendingTab()"
            [openPlantingYear]="pendingPlantingYear()"
            [savedListsForCustomer]="savedListsForSelectedCustomer()"
            [teamListsForCustomer]="teamListsForSelectedCustomer()"
            [canEditTeamLists]="canEditTeamLists()"
            (onContractsWideChange)="contractsWide.set($event)"
            (onSaveSavedListMembership)="handleSaveSavedListMembership($event)">
          </app-customer-profile>
        } @else {
          <!-- Empty state — shown on desktop when no customer is selected -->
          <div class="hidden lg:block rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
            <div class="p-8 text-center text-gray-500 dark:text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-4 opacity-40">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
              <p class="font-medium text-gray-700 dark:text-gray-300">Select a Producer</p>
              <p class="text-sm mt-1">Choose a producer from the list to view their profile, contracts, tickets, and notes.</p>
            </div>
          </div>
        }
      </div>

      <!-- Notes Column - Below profile until xl, then right sidebar, sticky on xl+ (38.7% on 2xl) -->
      @if (selectedCustomer(); as customer) {
        <!-- gap-3 matches the xl:gap-3 between this column and the profile column, so the gap above Notes reads the
             same as the gap beside it. A flex gap rather than space-y: the panels sit inside the slot's element, which
             takes no space (display: contents), so they are not the column's direct children. -->
        <div class="xl:sticky xl:top-0 xl:self-start xl:max-h-full xl:overflow-auto xl:pr-1 xl:pb-4 flex flex-col gap-3">
          <!-- The modules' panels for this producer: Engagement's My follow-ups (the short, actionable list) above
               its Notes (the long history). -->
          <app-customer-slot slot="sidebar" />
        </div>
      }
    </div>
  </div>
</div>

<!-- Floating originator calculators launcher (Profitability + future calc types).
     Only shown when a producer is selected — the calculator prefills their name. -->
@if (calculatorEnabled && selectedCustomer(); as producer) {
  <app-calculator-launcher [producerName]="producer.name" />
}
