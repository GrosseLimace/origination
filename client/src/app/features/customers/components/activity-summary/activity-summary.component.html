    <div class="rounded-xl border border-green-200 dark:border-green-800 overflow-hidden">
      <div class="bg-green-50 dark:bg-green-900/20" [class.p-6]="expanded()" [class.px-6]="!expanded()" [class.py-4]="!expanded()">
        <!-- The whole header toggles, so the hit target is the full row rather than a small chevron. -->
        <button
          type="button"
          (click)="toggle()"
          [attr.aria-expanded]="expanded()"
          aria-controls="activity-summary-body"
          class="w-full flex items-center gap-2 text-left rounded-md focus:outline-none focus:ring-2 focus:ring-green-500/40"
          [class.mb-4]="expanded()"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-600 dark:text-green-400 shrink-0">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
            <path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
          </svg>
          <h3 class="font-semibold text-lg text-green-600 dark:text-green-400">Activity Summary</h3>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
            class="ml-auto shrink-0 text-green-600 dark:text-green-400 transition-transform"
            [class.rotate-180]="!expanded()">
            <path d="m18 15-6-6-6 6"/>
          </svg>
        </button>
        @if (expanded()) {
          <p id="activity-summary-body" class="text-gray-700 dark:text-gray-300 text-sm leading-relaxed">
            {{ summaryText }}
          </p>
        }
      </div>
    </div>
