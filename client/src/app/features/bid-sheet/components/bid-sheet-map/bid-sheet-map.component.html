<div class="relative w-full h-full">
  <!--
    `absolute!` (position: absolute !important) is deliberate — see field-tag-map.component.html's
    identical comment. MapLibre adds `.maplibregl-map` to this container at runtime, and its own
    stylesheet rule (`.maplibregl-map { position: relative }`) has equal specificity to Tailwind's
    `absolute` utility and wins on cascade order, silently demoting the container to
    position:relative — which defeats `inset-0` and collapses the container to height 0, leaving a
    blank map. This bit field-tagging once; the fix is ported, not rediscovered.
  -->
  <div #mapContainer class="absolute! inset-0"></div>

  <!-- Base-layer switch overlay — same UX as the Leaflet path's mapSwitching overlay. -->
  @if (switching()) {
    <div class="absolute inset-0 z-[1100] flex items-center justify-center bg-white/40 dark:bg-gray-900/40 backdrop-blur-[1px] pointer-events-none">
      <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-white/90 dark:bg-gray-800/90 shadow-lg">
        <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-gray-300 dark:border-gray-600 border-t-scoular-green dark:border-t-scoular-green"></div>
        <span class="text-sm font-medium text-gray-600 dark:text-gray-300">Loading map…</span>
      </div>
    </div>
  }

  <!-- Basemap toggle — three-way (Satellite/Map/Hybrid), reused verbatim from
       field-tag-map.component.html's basemap button row. Stacked directly ABOVE the parent's
       bottom-left action row (Add Location / engine toggle / Refresh) rather than sharing that row
       at a fixed horizontal offset — the parent's row width varies (fewer buttons in MapLibre mode
       than Leaflet mode, and either way the text can reflow), so a shared row with a hardcoded
       left offset collided with those buttons. Stacking vertically is offset-width-independent. -->
  <div class="absolute bottom-16 left-4 z-[1000] flex items-center gap-1 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-lg p-1">
    <button
      type="button"
      class="rounded-md px-2 py-1 text-xs font-medium"
      [class.bg-gray-200]="basemapStyle() === 'imagery'"
      [class.dark:bg-gray-600]="basemapStyle() === 'imagery'"
      [class.text-gray-700]="basemapStyle() !== 'imagery'"
      [class.dark:text-gray-300]="basemapStyle() !== 'imagery'"
      title="Satellite imagery"
      (click)="setBasemap('imagery')">
      Satellite
    </button>
    <button
      type="button"
      class="rounded-md px-2 py-1 text-xs font-medium"
      [class.bg-gray-200]="basemapStyle() === 'street'"
      [class.dark:bg-gray-600]="basemapStyle() === 'street'"
      [class.text-gray-700]="basemapStyle() !== 'street'"
      [class.dark:text-gray-300]="basemapStyle() !== 'street'"
      title="Streets and boundaries"
      (click)="setBasemap('street')">
      Map
    </button>
    <button
      type="button"
      class="rounded-md px-2 py-1 text-xs font-medium"
      [class.bg-gray-200]="basemapStyle() === 'hybrid'"
      [class.dark:bg-gray-600]="basemapStyle() === 'hybrid'"
      [class.text-gray-700]="basemapStyle() !== 'hybrid'"
      [class.dark:text-gray-300]="basemapStyle() !== 'hybrid'"
      title="Satellite with roads and labels"
      (click)="setBasemap('hybrid')">
      Hybrid
    </button>
  </div>

  <!-- Geocoded address search — additive to the parent's pin-NAME filter box (top-left, inside the
       parent's floating filter bar); this jumps the camera to an arbitrary address instead of
       filtering visible pins, most useful in Add Location mode before dropping a pin. Placed
       top-right (distinct corner from the parent's filter bar) so the two search boxes never
       visually collide; stacked BELOW the CLU/Parcel toggle (rather than sharing its row at a fixed
       offset) when that toggle is present, same width-independent stacking idiom already used for
       the basemap toggle vs. the parent's bottom-left action row above. -->
  <form
    class="absolute right-3 z-[1000] flex items-center gap-1 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-lg px-2 py-1.5"
    [class.top-3]="!landMapMagicKey()"
    [class.top-14]="!!landMapMagicKey()"
    (submit)="$event.preventDefault(); emitAddressSearch()">
    <input
      type="text"
      placeholder="Search for an address…"
      class="w-40 sm:w-56 bg-transparent text-sm text-gray-900 dark:text-gray-100 placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:outline-none px-1"
      [value]="addressSearchText()"
      (input)="addressSearchText.set($any($event.target).value)" />
    <button
      type="submit"
      class="shrink-0 rounded-md p-1.5 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 disabled:opacity-50"
      [disabled]="searchPending()"
      title="Fly to address">
      @if (searchPending()) {
        <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
      } @else {
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      }
    </button>
  </form>

  <!-- CLU/Parcel optional view toggle — hidden entirely when no LandMapMagic key is configured.
       Two buttons only (no "draw" tier, no tier-hint copy — see
       docs/poc/bid-sheet-map/03-frontend-components.md). Clicking the active tier turns it back off. -->
  @if (landMapMagicKey()) {
    <div class="absolute top-3 right-3 z-[1000] flex items-center gap-1 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-lg p-1">
      <button
        type="button"
        class="rounded-md px-2 py-1 text-xs font-medium"
        [class.bg-green-100]="showFieldContext() === 'clu'"
        [class.dark:bg-green-900]="showFieldContext() === 'clu'"
        [class.text-gray-700]="showFieldContext() !== 'clu'"
        [class.dark:text-gray-300]="showFieldContext() !== 'clu'"
        title="CLU field boundaries (read-only)"
        (click)="toggleFieldContext('clu')">
        CLU
      </button>
      <button
        type="button"
        class="rounded-md px-2 py-1 text-xs font-medium"
        [class.bg-blue-100]="showFieldContext() === 'parcel'"
        [class.dark:bg-blue-900]="showFieldContext() === 'parcel'"
        [class.text-gray-700]="showFieldContext() !== 'parcel'"
        [class.dark:text-gray-300]="showFieldContext() !== 'parcel'"
        title="Parcel boundaries (read-only)"
        (click)="toggleFieldContext('parcel')">
        Parcel
      </button>
    </div>
  }
</div>
