@if (options().length > 0) {
  <div class="py-2 border-b border-gray-200 dark:border-gray-700 px-4">
    <select
      aria-label="Saved list"
      [ngModel]="selectedId()"
      (ngModelChange)="pick($event)"
      class="w-full h-9 px-3 rounded-md border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-base text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-scoular-green"
    >
      <option value="all">All Producers</option>
      @for (list of options(); track list.id) {
        <option [value]="list.id" class="text-gray-900 dark:text-white">{{ list.name }}{{ selectedId() === '' + list.id && count() ? ' (' + count() + ')' : '' }}</option>
      }
    </select>
  </div>
}
