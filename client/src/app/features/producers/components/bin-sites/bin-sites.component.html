@if (singleSite(); as site) {
  <div class="flex items-center gap-2 text-gray-600 dark:text-gray-400 min-w-0">
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" class="shrink-0 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 8.35V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.35A2 2 0 0 1 3.26 6.5l8-3.2a2 2 0 0 1 1.48 0l8 3.2A2 2 0 0 1 22 8.35Z"/><path d="M6 18h12"/><path d="M6 14h12"/><rect width="12" height="12" x="6" y="10"/>
    </svg>
    <span class="min-w-0 break-words" title="Bin site">
      {{ site.name }}@if (site.capacity !== '—') {<span class="text-gray-400 dark:text-gray-500"> · {{ site.capacity }} bu</span>}
    </span>
    @if (site.url) {
      <a [href]="site.url" target="_blank" rel="noopener noreferrer" (click)="trackMapClick()"
        title="Open in Google Maps" [attr.aria-label]="'Open ' + site.name + ' in Google Maps'"
        class="inline-flex shrink-0 text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      </a>
    }
  </div>
} @else if (rows().length > 1) {
  <div>
    <button type="button" (click)="toggle()" [attr.aria-expanded]="expanded()" aria-controls="bin-sites-table"
      class="flex items-center gap-2 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" class="shrink-0 transition-transform" [class.rotate-90]="expanded()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      <span>Bin Sites ({{ rows().length }})</span>
    </button>
    @if (expanded()) {
      <!-- Auto-sized, never scrolls: w-auto shrinks the table to its content and
           max-w-full stops it at the Contact column edge. Values are centered under
           their headers, empty ones "—"; the pin opens Google Maps (its tooltip is the
           only one on the rows), "—" when a site has no coordinates. Name is the only
           column that gives way: it wraps (two lines, then "…"); numbers never wrap. -->
      <div id="bin-sites-table" class="mt-1.5 ml-5 max-w-full">
        <table class="w-auto max-w-full text-xs @4xl/profile:text-sm tabular-nums">
          <thead>
            <tr class="text-[10px] @4xl/profile:text-xs uppercase tracking-wide text-gray-400 dark:text-gray-500">
              <th scope="col" class="py-1 pr-3 @4xl/profile:pr-4 font-medium text-left">Name</th>
              <th scope="col" class="py-1 px-2 @4xl/profile:px-3 font-medium text-center" title="Capacity (bu)">Cap</th>
              <th scope="col" class="py-1 pl-2 @4xl/profile:pl-3 font-medium text-center"><span class="sr-only">Map</span></th>
            </tr>
          </thead>
          <tbody class="text-gray-700 dark:text-gray-300">
            @for (site of rows(); track $index) {
              <tr class="border-t border-gray-100 dark:border-gray-700/60 align-middle">
                <td class="py-1 pr-3 @4xl/profile:pr-4 text-left"><span class="line-clamp-2 break-words">{{ site.name }}</span></td>
                <td class="py-1 px-2 @4xl/profile:px-3 text-center whitespace-nowrap">{{ site.capacity }}</td>
                <td class="py-1 pl-2 @4xl/profile:pl-3 text-center">
                  @if (site.url) {
                    <a [href]="site.url" target="_blank" rel="noopener noreferrer" (click)="trackMapClick()"
                      title="Open in Google Maps" [attr.aria-label]="'Open ' + site.name + ' in Google Maps'"
                      class="inline-flex text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors">
                      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                    </a>
                  } @else {
                    <span class="text-gray-300 dark:text-gray-600">—</span>
                  }
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </div>
}
