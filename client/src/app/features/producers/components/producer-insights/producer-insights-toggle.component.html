<button
  type="button"
  class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md border text-xs sm:text-sm font-medium transition-colors"
  [class]="panels.open() ? 'bg-scoular-green-accessible text-white border-scoular-green-accessible' : 'border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'"
  (click)="panels.toggle()"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" x2="18" y1="20" y2="10"/>
    <line x1="12" x2="12" y1="20" y2="4"/>
    <line x1="6" x2="6" y1="20" y2="14"/>
  </svg>
  Producer Insights
</button>
