@if (shown()) {
  <button
    type="button"
    (click)="panel.open.update(open => !open)"
    [attr.aria-expanded]="panel.open()"
    aria-controls="organic-certification-panel"
    title="Organic producer"
    class="shrink-0 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-scoular-green/10 text-scoular-green-accessible dark:bg-scoular-green/20 dark:text-scoular-green border border-green-200 dark:border-green-800 hover:bg-scoular-green/20 dark:hover:bg-scoular-green/20 transition-colors cursor-pointer"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
    </svg>
    <!-- Short label in a narrow column so the badges stay on the name's row. -->
    <span class="@4xl/profile:hidden">Organic</span>
    <span class="hidden @4xl/profile:inline">Organic Producer</span>
  </button>
}
