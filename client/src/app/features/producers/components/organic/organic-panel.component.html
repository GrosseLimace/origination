@if (shown() && panel.open()) {
  <div id="organic-certification-panel" class="mt-2 header-panel">
    <p class="text-sm font-semibold text-gray-500 dark:text-gray-300 uppercase tracking-wider mb-1.5">Organic</p>
    @if (customer()?.nopId; as nopId) {
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm">
        <span class="inline-flex items-center gap-1.5">
          <span class="text-gray-500 dark:text-gray-400 @4xl/profile:hidden">NOPID</span>
          <span class="text-gray-500 dark:text-gray-400 hidden @4xl/profile:inline">NOP ID</span>
          <span class="font-medium text-gray-900 dark:text-gray-100">{{ nopId }}</span>
        </span>
      </div>
    } @else {
      <p class="text-sm text-gray-500 dark:text-gray-400 italic">No NOP ID on file for this producer.</p>
    }
    <!-- Certification status, expiry date and certified commodities arrive with the
         NOP certification feed; until then this panel carries the id alone. -->
  </div>
}
