@for (contact of contacts(); track $index) {
  <div class="flex items-center gap-2 text-gray-600 dark:text-gray-400 flex-wrap">
    <!-- Primary contact gets a star in place of the person icon; the rest get the person icon. -->
    @if (contact.isPrimary) {
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="shrink-0 text-gray-400" role="img" aria-label="Primary contact">
        <title>Primary contact</title>
        <path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" class="shrink-0 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
    }
    <span>{{ contact.name }}</span>
    @if (contact.phone) {
      <span class="text-gray-300 dark:text-gray-600">&middot;</span>
      <a [href]="'tel:' + contact.phone" (click)="trackCall()" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors">{{ contact.phone }}</a>
    }
    @if (contact.email) {
      <span class="text-gray-300 dark:text-gray-600">&middot;</span>
      <a [href]="'mailto:' + contact.email" (click)="trackEmail()" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors truncate">{{ contact.email }}</a>
    }
  </div>
}
