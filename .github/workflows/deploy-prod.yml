name: Originations Deploy to PROD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Angular dependencies
        run: npm ci
        working-directory: client
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build Angular (production)
        run: npx ng build --configuration production
        working-directory: client

      - name: Build and Publish
        run: dotnet publish api/GrainOriginatorPortal.Api -c Release -o ./publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      # Apply EF Core migrations BEFORE deploying new app code so the schema is ready
      # when the new code starts handling traffic. Uses the OIDC identity from the Azure
      # Login step above to connect via Active Directory Default auth (per appsettings.Production.json).
      # The OIDC identity needs db_ddladmin + db_datareader + db_datawriter on Origination DB.
      - name: Restore EF Core tools
        run: dotnet tool restore

      - name: Apply EF Core migrations (Prod)
        run: dotnet ef database update --project api/GrainOriginatorPortal.Api --context ApplicationDbContext
        env:
          ASPNETCORE_ENVIRONMENT: Production
          # ApplicationDbContextFactory reads this and uses DefaultAzureCredential for AAD auth.
          # No password / secret — Server + Database only; the OIDC identity from azure/login
          # supplies the access token at runtime.
          ConnectionStrings__DefaultConnection: "Server=tcp:azrscosqlp01.database.windows.net,1433;Database=Origination;Encrypt=true;"

      - name: Deploy to Prod
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-origination-eus
          package: ./publish
