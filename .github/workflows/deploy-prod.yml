name: Originations Deploy to PROD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      # TEMP DIAGNOSTIC — remove once the OIDC root cause is confirmed. The token IS issued (env vars
      # present), so this now probes whether the runner can REACH the GHE token service. Unauthenticated
      # GET — the token value/bearer is never touched, only presence flags + the resulting HTTP status.
      - name: Diagnose OIDC token availability
        run: |
          echo "Runner: ${RUNNER_NAME:-?} (${RUNNER_OS:-?}/${RUNNER_ARCH:-?})"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "HTTPS_PROXY set: ${HTTPS_PROXY:+yes}${https_proxy:+yes}   NO_PROXY set: ${NO_PROXY:+yes}${no_proxy:+yes}"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "id-token not injected — stopping"; exit 0; fi
          host=$(printf '%s' "$ACTIONS_ID_TOKEN_REQUEST_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          echo "OIDC issuer host: $host"
          # Reachability only (no Authorization header → token never used). Any HTTP code proves the
          # host is reachable; '000' means the TCP/TLS connection itself failed (egress/proxy blocked).
          code=$(curl -sS --connect-timeout 10 -m 20 -o /dev/null -w '%{http_code}' "$ACTIONS_ID_TOKEN_REQUEST_URL" 2>/tmp/curlerr || true)
          echo "Token endpoint reachability (unauthenticated): HTTP ${code:-000}"
          echo "curl error (if any): $(cat /tmp/curlerr 2>/dev/null)"
          echo "Interpretation: 000 => cannot connect (egress/proxy/firewall to \$host); 401/403/400 => reachable, so cause is downstream (azure/login version or Azure federated-credential issuer)."

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Angular dependencies
        run: npm ci
        working-directory: client
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build Angular (production)
        run: npx ng build --configuration production
        working-directory: client

      - name: Build and Publish
        run: dotnet publish api/GrainOriginatorPortal.Api -c Release -o ./publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      # Apply EF Core migrations BEFORE deploying new app code so the schema is ready
      # when the new code starts handling traffic. Uses the OIDC identity from the Azure
      # Login step above to connect via Active Directory Default auth (per appsettings.Production.json).
      # The OIDC identity needs db_ddladmin + db_datareader + db_datawriter on Origination DB.
      - name: Restore EF Core tools
        run: dotnet tool restore

      - name: Apply EF Core migrations (Prod)
        run: dotnet ef database update --project api/GrainOriginatorPortal.Api --context ApplicationDbContext
        env:
          ASPNETCORE_ENVIRONMENT: Production
          # ApplicationDbContextFactory reads this and uses DefaultAzureCredential for AAD auth.
          # No password / secret — Server + Database only; the OIDC identity from azure/login
          # supplies the access token at runtime.
          ConnectionStrings__DefaultConnection: "Server=tcp:azrscosqlp01.database.windows.net,1433;Database=Origination;Encrypt=true;"

      - name: Deploy to Prod
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-origination-eus
          package: ./publish
