name: Deploy to Dev

on:
  push:
    branches: [main]
    paths-ignore:
      - 'developer-docs/**'
      - 'style-guides/**'
      - '*.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Angular dependencies
        run: npm ci
        working-directory: client
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build Angular (dev)
        run: npx ng build --configuration dev
        working-directory: client

      - name: Build and Publish
        run: dotnet publish api/GrainOriginatorPortal.Api -c Release -o ./publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_NONPROD }}

      - name: Deploy to Dev
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-origination-dev-eus
          package: ./publish
