name: Originations Deploy to DEV

on:
  push:
    branches: [main]
    paths-ignore:
      - 'developer-docs/**'
      - 'style-guides/**'
      - '*.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      # TEMP DIAGNOSTIC — remove once the OIDC root cause is confirmed. Prints whether this job is
      # receiving GitHub's OIDC token endpoint (the env vars azure/login needs). Shows only presence
      # ("yes"/empty) and the non-secret issuer host — never the token value itself.
      - name: Diagnose OIDC token availability
        run: |
          echo "Runner: ${RUNNER_NAME:-?} (${RUNNER_OS:-?}/${RUNNER_ARCH:-?})"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC issuer host: $(printf '%s' "$ACTIONS_ID_TOKEN_REQUEST_URL" | sed -E 's#^(https?://[^/]+).*#\1#')"
          else
            echo "OIDC issuer host: <none — id-token not being injected into this job>"
          fi

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Angular dependencies
        run: npm ci
        working-directory: client
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build Angular (dev)
        run: npx ng build --configuration dev
        working-directory: client

      - name: Build and Publish
        run: dotnet publish api/GrainOriginatorPortal.Api -c Release -o ./publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_NONPROD }}

      # Apply EF Core migrations BEFORE deploying new app code so the schema is ready
      # when the new code starts handling traffic. Uses the OIDC identity from the Azure
      # Login step above to connect via Active Directory Default auth (per appsettings.Development.json).
      # The OIDC identity needs db_ddladmin + db_datareader + db_datawriter on Origination DB.
      - name: Restore EF Core tools
        run: dotnet tool restore

      - name: Apply EF Core migrations (Dev)
        run: dotnet ef database update --project api/GrainOriginatorPortal.Api --context ApplicationDbContext
        env:
          ASPNETCORE_ENVIRONMENT: Development
          # ApplicationDbContextFactory reads this and uses DefaultAzureCredential for AAD auth.
          # No password / secret — Server + Database only; the OIDC identity from azure/login
          # supplies the access token at runtime.
          ConnectionStrings__DefaultConnection: "Server=tcp:azrscosqld01.database.windows.net,1433;Database=Origination;Encrypt=true;"

      - name: Deploy to Dev
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-origination-dev-eus
          package: ./publish
