name: PR Validation

# Pull-request gate (style-guides/automated-testing.md §13): runs the fast tiers —
# static build + frontend unit/component (Vitest) + backend unit (xUnit) — on every PR
# to main. SQL-backed integration tests (Category=Integration) and Playwright E2E are
# NOT run here; they live in their own lanes (see e2e.yml / the deferred integration lane).
# This workflow does not touch Azure, so it needs no OIDC.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'developer-docs/**'
      - 'style-guides/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # SECURITY (self-hosted + untrusted PR code): only run for PRs from branches IN THIS REPO
    # (block forks) or on manual dispatch. This pairs with two other controls:
    #   1. The repo's "Require approval for all pull-request runs" Actions setting — a maintainer
    #      reviews the diff before any PR code executes on the self-hosted runner. (Manual repo setting.)
    #   2. NPM_TOKEN scoped to the install step, which runs `npm ci --ignore-scripts` so dependency /
    #      package.json lifecycle scripts can't execute (or read the token) during install.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Full history so the (report-only) diff-coverage step can compare against origin/main.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.x'

      - name: Install Angular dependencies
        # --ignore-scripts: don't execute dependency/package.json lifecycle (postinstall) scripts,
        # so untrusted PR code can't run or exfiltrate NPM_TOKEN during install. The token is scoped
        # to THIS step only. (Browsers for E2E are installed in e2e.yml, not here.)
        run: npm ci --ignore-scripts
        working-directory: client
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ---- Supply-chain and contract gates (SEC-ARCH-BURDI-001 §9.3) -------------------------
      # Dependabot alerts on GHE are the system of record (docs/security); this step fails the PR
      # fast on a HIGH/CRITICAL advisory in the PRODUCTION dependency tree. Dev-only tooling is
      # excluded here and handled through Dependabot triage.
      - name: Dependency vulnerability scan (npm, production tree)
        run: npm audit --omit=dev --audit-level=high
        working-directory: client

      # openapi/mobile/specification.yaml is the APIM allow-list for the mobile surface. Lint it here so a
      # malformed contract never reaches Data Integrations; the backend drift test (xUnit, below)
      # proves it matches the api/mobile/v1 controllers.
      - name: OpenAPI contract lint (mobile surface)
        run: npx --yes @redocly/cli@2.54.2 lint openapi/mobile/specification.yaml

      - name: Frontend unit + component tests (Vitest)
        run: npm run test:coverage
        working-directory: client

      # Build the PRODUCTION configuration, not development. Budgets are declared only on the
      # production config (angular.json), so a bundle-size regression used to pass CI, pass the Dev
      # and QA deploys — which build `dev` / `qa`, also budget-free — and fail for the first time at
      # the PROD deploy, which is the only workflow that builds `production`. Production is a strict
      # superset of the development check here: it compiles the same code, plus optimization and
      # budgets, so nothing is lost by not also building development.
      - name: Frontend build (production — also enforces bundle budgets)
        run: npx ng build --configuration production
        working-directory: client

      # The mobile PWA is typed against openapi/mobile/specification.yaml through a generated file. Regenerate
      # and fail if the committed copy is stale, then build the mobile project (its own budgets).
      - name: Mobile client — contract types are current
        shell: bash
        run: |
          npx openapi-typescript ../openapi/mobile/specification.yaml -o projects/mobile/src/app/core/api/api-types.ts
          git diff --exit-code -- projects/mobile/src/app/core/api/api-types.ts \
            || { echo "::error::projects/mobile/src/app/core/api/api-types.ts is stale — regenerate from openapi/mobile/specification.yaml and commit."; exit 1; }
        working-directory: client

      - name: Mobile client build (production — enforces its bundle budgets)
        run: npx ng build origination-mobile --configuration production
        working-directory: client

      - name: Restore .NET solution
        run: dotnet restore GrainOriginatorPortal.sln --locked-mode

      # Transitive NuGet advisories. `dotnet list package --vulnerable` exits 0 even when it finds
      # something, so the output is inspected explicitly.
      - name: Dependency vulnerability scan (NuGet, incl. transitive)
        shell: bash
        run: |
          set -o pipefail
          dotnet list GrainOriginatorPortal.sln package --vulnerable --include-transitive | tee nuget-vulnerable.txt
          if grep -q "has the following vulnerable packages" nuget-vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found — see the list above."
            exit 1
          fi

      # SAST: the Roslyn security analyzers (CA2100, CA3xxx injection, CA23xx deserialization,
      # CA53xx/CA54xx crypto + TLS + token validation) are promoted to build ERRORS in
      # api/.editorconfig, so this build step is also the static security gate. CodeQL is not
      # available on this GHE until Advanced Security is enabled (PLATFORM-REQUESTS.md E14).
      - name: Build .NET solution (Roslyn security analyzers enforced as errors)
        run: dotnet build GrainOriginatorPortal.sln -c Release --no-restore

      - name: Backend unit tests (xUnit)
        # Integration tests (when added) carry [Trait("Category","Integration")] and run in a
        # separate DB-backed lane, never on the per-PR gate.
        run: >
          dotnet test GrainOriginatorPortal.sln -c Release --no-build
          --filter "Category!=Integration"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Publish coverage reports (report-only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage
          path: |
            client/coverage/
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

      # Coverage is REPORTED, not yet enforced (per the approved plan). Vitest prints a
      # frontend summary above; the backend Cobertura report is uploaded as an artifact.
      # TODO: once both suites have a baseline, add a diff-coverage step (e.g. `diff-cover`)
      # with `--fail-under 80` to enforce the §4 floor on changed lines.
