name: Data Source Alerts Deploy

on:
  # Manual-only, matching the Logic App and workbook deploy workflows. Trigger from the Actions tab (Run workflow).
  # One workflow for QA and PROD: the template and rules are identical, only the parameters file and target
  # resource group differ. Dev is left out on purpose: it shares the CTRM Test gateway with QA, so a Test outage
  # would email twice, and Dev restarts often enough to trip the database alert after deploys.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy the alerts to'
        type: choice
        default: qa
        options:
          - qa
          - prod
      mode:
        description: 'what-if (preview only) or create (deploy)'
        type: choice
        default: what-if
        options:
          - what-if
          - create

env:
  RESOURCE_GROUP: ${{ inputs.environment == 'prod' && 'rg-origination-eus' || format('rg-origination-{0}-eus', inputs.environment) }}
  TEMPLATE: infra/alerts/data-source-alerts/azuredeploy.json
  PARAMETERS: infra/alerts/data-source-alerts/azuredeploy.parameters.${{ inputs.environment }}.json

jobs:
  deploy:
    runs-on: self-hosted
    # The GitHub environment carries that environment's OIDC identity and approval rules (prod included).
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # azure/login has no built-in retry, and the GHE data-residency OIDC token service can blip
      # intermittently ("Failed to fetch federated token from GitHub"). Attempt once, wait, then retry —
      # the job fails only if BOTH attempts fail. (Token handling stays inside the action; never logged.)
      - name: Azure Login (OIDC)
        id: azlogin
        continue-on-error: true
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.environment == 'prod' && secrets.AZURE_SUBSCRIPTION_ID_PROD || secrets.AZURE_SUBSCRIPTION_ID_NONPROD }}

      - name: Wait before Azure login retry
        if: steps.azlogin.outcome == 'failure'
        run: sleep 15

      - name: Azure Login (OIDC) — retry
        if: steps.azlogin.outcome == 'failure'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.environment == 'prod' && secrets.AZURE_SUBSCRIPTION_ID_PROD || secrets.AZURE_SUBSCRIPTION_ID_NONPROD }}

      # Preview the change set. Always run so the deploy step has a diff to compare against, and so
      # a manual "what-if" run is useful on its own.
      #
      # NOTE: call az directly rather than via azure/cli@v2 — that action runs az inside a Linux
      # container and fails on our Windows self-hosted runners ("Please use Linux-based OS as a runner").
      # The @-prefixed parameters path is quoted so PowerShell treats it as a literal string.
      - name: What-if (preview)
        run: az deployment group what-if -g "${{ env.RESOURCE_GROUP }}" --template-file "${{ env.TEMPLATE }}" --parameters "@${{ env.PARAMETERS }}"

      - name: Deploy
        if: ${{ inputs.mode == 'create' }}
        run: az deployment group create -g "${{ env.RESOURCE_GROUP }}" --template-file "${{ env.TEMPLATE }}" --parameters "@${{ env.PARAMETERS }}"
