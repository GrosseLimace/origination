name: Deploy Logic App (Notes Daily Recap) to QA

on:
  # Manual-only, matching the app deploy workflows. Trigger from the Actions tab (Run workflow).
  workflow_dispatch:
    inputs:
      mode:
        description: 'what-if (preview only) or create (deploy)'
        type: choice
        default: what-if
        options:
          - what-if
          - create

env:
  RESOURCE_GROUP: rg-origination-qa-eus
  TEMPLATE: infra/logic-apps/notes-daily-recap/azuredeploy.json
  PARAMETERS: infra/logic-apps/notes-daily-recap/azuredeploy.parameters.qa.json

jobs:
  deploy:
    runs-on: self-hosted
    environment: qa
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # azure/login has no built-in retry, and the GHE data-residency OIDC token service can blip
      # intermittently ("Failed to fetch federated token from GitHub"). Attempt once, wait, then retry —
      # the job fails only if BOTH attempts fail. (Token handling stays inside the action; never logged.)
      - name: Azure Login (OIDC)
        id: azlogin
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_NONPROD }}

      - name: Wait before Azure login retry
        if: steps.azlogin.outcome == 'failure'
        run: sleep 15

      - name: Azure Login (OIDC) — retry
        if: steps.azlogin.outcome == 'failure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_NONPROD }}

      # Preview the change set. Always run so the deploy step has a diff to compare against, and so
      # a manual "what-if" run is useful on its own.
      - name: What-if (preview)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az deployment group what-if \
              -g "$RESOURCE_GROUP" \
              --template-file "$TEMPLATE" \
              --parameters @"$PARAMETERS"

      - name: Deploy
        if: ${{ inputs.mode == 'create' }}
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az deployment group create \
              -g "$RESOURCE_GROUP" \
              --template-file "$TEMPLATE" \
              --parameters @"$PARAMETERS"
