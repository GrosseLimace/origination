name: Instant Share Note PROD Deploy Logic App

on:
  # Manual-only, matching the app deploy workflows. Trigger from the Actions tab (Run workflow).
  workflow_dispatch:
    inputs:
      mode:
        description: 'what-if (preview only) or create (deploy)'
        type: choice
        default: what-if
        options:
          - what-if
          - create

env:
  RESOURCE_GROUP: rg-origination-eus
  TEMPLATE: infra/logic-apps/instant-share-note/azuredeploy.json
  PARAMETERS: infra/logic-apps/instant-share-note/azuredeploy.parameters.prod.json

jobs:
  deploy:
    runs-on: self-hosted
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # azure/login has no built-in retry, and the GHE data-residency OIDC token service can blip
      # intermittently ("Failed to fetch federated token from GitHub"). Attempt once, wait, then retry —
      # the job fails only if BOTH attempts fail. (Token handling stays inside the action; never logged.)
      - name: Azure Login (OIDC)
        id: azlogin
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Wait before Azure login retry
        if: steps.azlogin.outcome == 'failure'
        run: sleep 15

      - name: Azure Login (OIDC) — retry
        if: steps.azlogin.outcome == 'failure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      # Preview the change set. Always run so the deploy step has a diff to compare against, and so
      # a manual "what-if" run is useful on its own.
      #
      # NOTE: call az directly rather than via azure/cli@v2 — that action runs az inside a Linux
      # container and fails on our Windows self-hosted runners ("Please use Linux-based OS as a runner").
      # azure/login above leaves the CLI authenticated for the rest of the job, and the runner has az
      # installed. The @-prefixed parameters path is quoted so PowerShell treats it as a literal string.
      - name: What-if (preview)
        run: az deployment group what-if -g "${{ env.RESOURCE_GROUP }}" --template-file "${{ env.TEMPLATE }}" --parameters "@${{ env.PARAMETERS }}"

      - name: Deploy
        if: ${{ inputs.mode == 'create' }}
        run: az deployment group create -g "${{ env.RESOURCE_GROUP }}" --template-file "${{ env.TEMPLATE }}" --parameters "@${{ env.PARAMETERS }}"
