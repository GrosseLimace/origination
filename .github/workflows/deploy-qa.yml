name: Deploy to QA

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: qa
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Angular dependencies
        run: npm ci
        working-directory: client
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build Angular (qa)
        run: npx ng build --configuration qa
        working-directory: client

      - name: Build and Publish
        run: dotnet publish api/GrainOriginatorPortal.Api -c Release -o ./publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_NONPROD }}

      - name: Set App Service environment
        shell: bash
        run: |
          RG=$(az webapp list --query "[?name=='app-origination-qa-eus'].resourceGroup | [0]" -o tsv)
          if [ -z "$RG" ]; then echo "ERROR: Could not resolve resource group"; exit 1; fi
          echo "Resource group: $RG"
          az webapp config appsettings set \
            --name app-origination-qa-eus \
            --resource-group "$RG" \
            --settings \
              ASPNETCORE_ENVIRONMENT=QA \
              KeyVaultUri=https://kv-orig-qa-eus.vault.azure.net/ \
              AzureAd__ClientId=f3fcab2b-98c8-4622-86bd-c874d281b22a \
              AzureAd__Audience=api://f3fcab2b-98c8-4622-86bd-c874d281b22a

      - name: Deploy to QA
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-origination-qa-eus
          package: ./publish
