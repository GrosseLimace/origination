name: E2E (Playwright)

# Thin end-to-end smoke (style-guides/automated-testing.md §10/§13). Runs nightly and
# on-demand — NOT on the per-PR gate (E2E belongs at the pre-deploy/scheduled tier). A future
# step can wire this as a pre-deploy workflow_call from the deploy workflows against a slot.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1-5'  # weekday mornings (UTC)

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        # --ignore-scripts: block dependency lifecycle (postinstall/prepare) scripts from reading and
        # exfiltrating NPM_TOKEN during install. Mirrors ci.yml; the Angular build needs no such scripts.
        run: npm ci --ignore-scripts
        working-directory: client
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Playwright browser
        # Download the Chromium binary only — NOT `--with-deps`, which shells out to `sudo apt-get`
        # to install OS libraries. The self-hosted runner's service account has no passwordless sudo
        # (no TTY), so `--with-deps` fails ("sudo: a password is required"). The required system
        # libraries are a ONE-TIME host install by a runner admin: `sudo npx playwright install-deps chromium`.
        run: npx playwright install chromium
        working-directory: client

      - name: Run E2E smoke
        run: npm run e2e
        working-directory: client

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: client/playwright-report/
          if-no-files-found: ignore
